---
# Creates the first superuser ("admin") once, with EPIConnect's own
# idempotent command. The password comes from the Secret and is given ONLY to
# this short-lived Job, never to the long-running web pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: epiconnect-bootstrap-admin
  namespace: epiconnect
  labels:
    app.kubernetes.io/name: epiconnect
    app.kubernetes.io/component: bootstrap-admin
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epiconnect
        app.kubernetes.io/component: bootstrap-admin
        epiconnect.io/db-client: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: epiconnect
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap-admin
          image: ghcr.io/rayenmabrouk/epiconnect:0b3cd06
          args: [bootstrap_admin, --password-env, ADMIN_PASSWORD]
          envFrom:
            - configMapRef:
                name: epiconnect-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: epiconnect-secrets, key: django-secret-key}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: epiconnect-secrets, key: db-password}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: epiconnect-secrets, key: admin-password}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
