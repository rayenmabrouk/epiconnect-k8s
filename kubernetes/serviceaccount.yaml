---
# The application never talks to the Kubernetes API, so its pods get an
# identity with no permissions (no Role/RoleBinding) and no API token mounted.
# A compromised pod therefore cannot query or change the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: epiconnect
  namespace: epiconnect
  labels:
    app.kubernetes.io/name: epiconnect
automountServiceAccountToken: false
