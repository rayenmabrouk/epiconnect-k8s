---
# SHAPE ONLY - never commit real values. The real Secret is created in the
# cluster by scripts/create-secrets.sh (random values, generated once):
#   make secrets
#
# Kubernetes Secrets are base64-encoded, NOT encrypted, in manifests. Here the
# cluster encrypts them at rest (k3s secrets-encryption, see the Ansible
# k3s_server role), and RBAC decides who may read them.
apiVersion: v1
kind: Secret
metadata:
  name: epiconnect-secrets
  namespace: epiconnect
type: Opaque
stringData:
  django-secret-key: "<64 random characters>"
  db-password: "<32 random characters>"
  admin-password: "<password of the 'admin' superuser>"
