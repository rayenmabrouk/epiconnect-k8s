{{- if .Values.postgres.enabled }}
# PostgreSQL: headless Service (stable DNS name "postgres") + StatefulSet with
# its own ReadWriteOnce volume. Names, selector and volumeClaimTemplates are
# identical to kubernetes/postgres/ so a running database can be adopted by
# this chart without being recreated.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "epiconnect.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    {{- include "epiconnect.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: epiconnect
    spec:
      nodeSelector:
        {{- toYaml .Values.postgres.nodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "epiconnect.podSecurityContext" (dict "uid" 70 "fsGroup" true) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.config.DB_NAME | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.DB_USER | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.config.DB_USER }}, -d, {{ .Values.config.DB_NAME }}]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.config.DB_USER }}, -d, {{ .Values.config.DB_NAME }}]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.config.DB_USER }}, -d, {{ .Values.config.DB_NAME }}]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "epiconnect.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
