---
# Same names and IPs as infra/lab.json (the Hyper-V side of the lab).
all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/k3s_lab_ed25519
  children:
    k3s_cluster:
      children:
        k3s_servers:          # control plane (+ PostgreSQL, NFS share)
          hosts:
            k3s-server:
              ansible_host: 192.168.50.10
              k3s_node_pool: data
        k3s_agents:           # application workloads
          hosts:
            k3s-worker1:
              ansible_host: 192.168.50.11
              k3s_node_pool: app
            k3s-worker2:
              ansible_host: 192.168.50.12
              k3s_node_pool: app
    nfs_servers:
      hosts:
        k3s-server:
