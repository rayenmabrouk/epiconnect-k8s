# Found automatically when ansible-* commands run from this directory
# (the Makefile always does: cd ansible && ansible-playbook ...).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
vault_password_file = ~/.config/epiconnect-k8s/vault-pass
interpreter_python = auto_silent
retry_files_enabled = False
# Readable task output (idempotency evidence is captured from it)
callback_result_format = yaml
forks = 5

[ssh_connection]
# Pipelining: modules are piped over the existing SSH session instead of
# copied to a temp file first -> fewer round trips per task
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
